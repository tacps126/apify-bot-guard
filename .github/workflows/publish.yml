# Publishes a GitHub Release to PyPI and npm. OFF until the repository variable
# PUBLISH_ENABLED is set to "true" (Settings, Secrets and variables, Actions,
# Variables). Each registry job runs in its own environment, so you can also
# require a manual approval per publish. Setup: docs/MAINTAINING.md.
name: Publish

on:
  release:
    types: [published] # releases made by hand; release.yml starts this workflow itself
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  pypi:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing: no API token stored
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        working-directory: python
        run: |
          pip install build
          python -m build --outdir ../dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  npm:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$(node -p 'require("./package.json").version')" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
