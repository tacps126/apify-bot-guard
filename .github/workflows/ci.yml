name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check . ../scripts ../examples
          ruff format --check . ../scripts ../examples
      - name: Types
        run: mypy
      - name: Tests + coverage
        run: |
          coverage run -m unittest discover -s tests -t . -v
          coverage report
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Coverage summary
        if: matrix.python == '3.13'
        run: |
          echo '### Python coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  js:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        if: matrix.node == 20
        run: npm test
      - name: Tests + coverage
        if: matrix.node != 20
        run: npm run coverage
      - name: Pack
        run: npm pack --dry-run

  parity:
    name: Python and JavaScript agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Same hashes and allowances in both packages
        run: python3 scripts/parity.py
      - name: Versions agree and the changelog has them
        run: python3 scripts/release_info.py check
      - name: Examples compile
        run: |
          for f in examples/*/*.py; do python3 -m py_compile "$f"; done
          for f in examples/*/*.js; do node --check "$f"; done
