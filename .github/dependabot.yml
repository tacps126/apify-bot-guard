version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: monthly
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly
